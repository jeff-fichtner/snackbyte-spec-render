# Release flow — consumes jeff-fichtner/snackbyte-release-flow-action (Recipe B, library /
# package-json strategy) and publishes to npm by TRUSTED PUBLISHING.
#
# The ritual: bump `version` in package.json, merge to main. The release job runs the full
# check gate, then the Action tags v<version> verbatim, so a failed check leaves no tag. A
# forgotten bump means the tag already exists and the Action fails loudly — that is the
# guard, not a bug.
#
# Two jobs, split by credential: `release` can push to the repository (the tag); `publish`
# can publish to npm. The token that publishes never shares a job with the token that
# writes to the repository.
#
# No npm token exists anywhere. `id-token: write` on the publish job lets GitHub mint a
# short-lived OIDC identity for that job and npm accepts it, provided the package's
# trusted publisher on npmjs.com names this repository and this workflow file. That can
# only be configured on a package that already exists on npm, so the FIRST publish of a
# new package is a bootstrap from a maintainer's machine (see RELEASING.md); every
# publish after it is this workflow. Provenance is attested automatically.
#
# One file serves the template and every package spun out of it: the publish step is
# gated on package.json's `private`. The template is private → it tags and skips, and
# says so. A package is not → it publishes. A package accidentally left private skips
# with a message instead of failing on npm's own refusal.
name: release

on:
  push:
    branches: [main] # the only release channel (see environments.json)

permissions:
  contents: read

concurrency:
  group: release # per releasable — every release channel shares it, no two pushes race
  cancel-in-progress: false
  queue: max # runs wait their turn instead of the next push replacing a waiting one

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the derived tag
    outputs:
      is-env: ${{ steps.release.outputs.is-env }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags — the derivation refuses a shallow clone

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run check:all # the push-side gate: a failed check leaves no tag

      - id: release
        uses: jeff-fichtner/snackbyte-release-flow-action@9fe8f168be05600b21f8998bc5cddcc17f188899 # v1.2.6
        with:
          version-strategy: package-json # library: tag the package.json version verbatim

  publish:
    needs: release
    if: needs.release.outputs.is-env == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC) — this is the whole credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; the npm bundled with a Node release may
      # be older. Cheap, and it tracks npm's own OIDC support.
      - run: npm install -g npm@latest

      - id: pkg
        run: echo "private=$(node -p "require('./package.json').private === true")" >> "$GITHUB_OUTPUT"

      - if: steps.pkg.outputs.private != 'true'
        run: |
          npm ci
          npm publish --access public
        # no NODE_AUTH_TOKEN: the OIDC identity above is the credential

      - if: steps.pkg.outputs.private == 'true'
        run: echo "private package — tagged $TAG, not published"
        env:
          TAG: ${{ needs.release.outputs.tag }}
